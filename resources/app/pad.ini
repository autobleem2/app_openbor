# The virtual gamepad for OpenBOR (the launcher's docs/virtual-gamepad-plan.md; rc/pad.default.ini has the rest).
#
# OpenBOR binds raw joystick buttons and axes, and an Xbox 360 pad's triggers are axes it would have to be taught.
# Shown the PlayStation Classic's own layout instead - Triangle 0, Circle 1, Cross 2, Square 3, L2 4, R2 5, L1 6,
# R1 7, Select 8, Start 9, the D-pad on axes 0/1 - every pad plays as the console's does, and the defaults in
# patches/openbor/0001-psc-pad-defaults.patch fit it.
virtual = psc
