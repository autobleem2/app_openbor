[app]
Title=OpenBOR
Author=OpenBOR by the OpenBOR Team (ChronoCrash); Beats of Rage by Senile Team
Version=7533-4
Image=icon.png
Readme=readme.txt
# the program for this machine (the launcher's docs/app-format-plan.md): bin/psc/OpenBOR on the console, bin/rpi,
# bin/rpi64, bin/pcusb on the appliances, bin/win/OpenBOR.exe on Windows. The launcher starts an App in its own
# folder, where OpenBOR keeps everything: the games (Paks/), the settings and saves (Saves/), Logs/, ScreenShots/.
Exec=bin/{key}/OpenBOR
# SDL2 is the launcher's (the console, Windows) or the system's; the codecs are linked in - nothing of its own
# OpenBOR reads raw joystick buttons; pad.ini has the virtual pad show it the PlayStation Classic's own layout,
# which patches/openbor/0001-psc-pad-defaults.patch binds as the 2019 PlayStation Classic port did
VirtualPad=true
Kernel=false
